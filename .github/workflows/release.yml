name: Release ModSync

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Tests
        run: dotnet test ModSync.sln -c Release

      - name: Extract Version From Tag
        id: get_version
        shell: pwsh
        run: |
          $rawTag = '${{ github.ref_name }}'
          $cleanVer = $rawTag.TrimStart('v').Trim()
          if ([string]::IsNullOrWhiteSpace($cleanVer)) { $cleanVer = "1.0.0" }
          Write-Host "Publishing version: $cleanVer"
          "version=$cleanVer" >> $env:GITHUB_OUTPUT

      - name: Publish Single-File Executable
        run: |
          dotnet publish src/ModSync/ModSync.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ steps.get_version.outputs.version }} -p:AssemblyVersion=${{ steps.get_version.outputs.version }}.0 -p:FileVersion=${{ steps.get_version.outputs.version }}.0 -o ./publish

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/ModSync.exe
          generate_release_notes: true
